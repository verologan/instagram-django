<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Instagram sencillo{% endblock %}</title>
    <style>
      :root {
        --bg: #fafafa;
        --card: #ffffff;
        --line: #dbdbdb;
        --text: #262626;
        --muted: #8e8e8e;
        --accent: #e1306c;
        --accent-soft: #fdf2f7;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      a { text-decoration: none; color: var(--text); }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 20px;
      }

      nav {
        background: rgba(255,255,255,0.96);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .nav-links {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }

      .nav-links a {
        font-size: 0.95rem;
        font-weight: 600;
      }

      .main {
        padding: 32px 0 60px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 22px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      }

      .post-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .username {
        font-weight: 700;
      }

      .meta {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .post-image {
        width: 100%;
        max-height: 650px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        border: 1px solid #f1f1f1;
      }

      .caption {
        margin: 16px 0 10px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .btn {
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        cursor: pointer;
        font-weight: 600;
      }

      .btn.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      .btn.secondary {
        background: var(--accent-soft);
        border-color: #f7d5e5;
        color: var(--accent);
      }

      .profile-card {
        padding: 28px;
      }

      .profile-header {
        display: flex;
        gap: 28px;
        align-items: center;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
      }

      .profile-top-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .profile-top-row h1 {
        margin: 0;
      }

      .avatar {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #f9d4e4, #d9f1ff);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 700;
        color: var(--text);
        overflow: hidden;
      }

      .stats {
        display: flex;
        gap: 28px;
        margin: 16px 0;
        flex-wrap: wrap;
      }

      .bio {
        margin: 0 0 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .mini-post {
        background: white;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .mini-post img {
        display: block;
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      form {
        margin-top: 12px;
      }

      textarea, input[type="text"], input[type="password"], input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .alert {
        padding: 12px 14px;
        background: #e8f7ed;
        border: 1px solid #b9e7c8;
        border-radius: 10px;
        color: #1d6f43;
        margin-bottom: 16px;
      }

      @media (max-width: 600px) {
        .profile-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .nav-inner {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="container nav-inner">
        <a href="/" class="brand">Instagram</a>

        <div class="nav-links">
          <a href="/">Inicio</a>
          <a href="/posts/">Posts</a>
          <a href="/posts/nueva/">Nueva publicación</a>
          <a href="/notificaciones/">Notificaciones</a>

          {% if user.is_authenticated %}
            <a href="/usuarios/{{ user.username }}/">Perfil</a>
            <a href="/accounts/logout/">Cerrar sesión</a>
          {% else %}
            <a href="/accounts/login/">Iniciar sesión</a>
            <a href="/registro/">Registrarse</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container main">
      {% if messages %}
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}

      {% block content %}
      {% endblock %}
    </main>
  </body>
</html>
