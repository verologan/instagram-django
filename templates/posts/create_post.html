{% extends 'base.html' %}

{% block title %}Nueva publicación{% endblock %}

{% block content %}
  <div class="card">
    <h2>Subir nueva foto</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <p>
        <label for="caption">Descripción:</label><br>
        <textarea id="caption" name="caption" rows="4" cols="60" placeholder="Escribe algo sobre tu foto..."></textarea>
      </p>

      <p>
        <label for="image">Imagen:</label><br>
        <input type="file" id="image" name="image" accept="image/*">
      </p>

      <button type="submit">Publicar</button>
    </form>
  </div>
{% endblock %}
