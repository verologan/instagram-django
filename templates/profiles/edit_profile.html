{% extends 'base.html' %}

{% block title %}Editar perfil{% endblock %}

{% block content %}
  <div class="card" style="max-width: 620px; margin: 0 auto;">
    <h2 style="margin-top: 0;">Editar perfil</h2>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <p>
        <label for="bio">Biografía</label><br>
        <textarea id="bio" name="bio" rows="4" placeholder="Cuéntanos algo sobre ti...">{{ profile.bio|default:'' }}</textarea>
      </p>

      <p>
        <label for="birth_date">Fecha de nacimiento</label><br>
        <input type="date" id="birth_date" name="birth_date" value="{{ profile.birth_date|date:'Y-m-d' }}">
      </p>

      <p>
        <label for="profile_picture">Foto de perfil</label><br>
        <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
      </p>

      <button type="submit" class="btn primary">Guardar cambios</button>
    </form>
  </div>
{% endblock %}
